<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Arch Backdrop with subtle gold border -->
  <path d="M70 120 L70 55 A50 50 0 0 1 170 55 L170 120 Z" fill="#FBF3EC" stroke="#D6B98C" stroke-width="1.8" />
  <path d="M74 118 L74 56 A46 46 0 0 1 166 56 L166 118 Z" fill="none" stroke="#D6B98C" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- Woman Profile Art in Deep Maroon / Champagne Gold -->
  <g transform="translate(120, 52) scale(0.72)">
    <!-- Hair Bun -->
    <ellipse cx="-16" cy="-4" rx="10" ry="12" fill="#6B2C3E"/>
    <!-- Bun floral ring (gajra) -->
    <path d="M-22 -12 A14 14 0 0 1 -10 -15" stroke="#D6B98C" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="-16" cy="-14" r="1.5" fill="#D6B98C"/>
    <circle cx="-20" cy="-10" r="1.5" fill="#D6B98C"/>
    <circle cx="-12" cy="-16" r="1.5" fill="#D6B98C"/>

    <!-- Head / Face Silhouette -->
    <path d="M-8 -18 C4 -18 12 -10 12 0 C12 6 10 9 6 13 C4 18 2 24 0 30 C-4 28 -8 24 -12 20 C-14 14 -16 8 -16 0 C-16 -10 -12 -18 -8 -18 Z" fill="#6B2C3E"/>
    
    <!-- Profile Chin and Neck contour -->
    <path d="M11 2 C13 3 14 5 13 8 C12 11 9 13 8 16 C7 20 7 26 8 32 C6 33 2 34 0 32" stroke="#6B2C3E" stroke-width="1.5" fill="none"/>
    
    <!-- Forehead Bindi -->
    <circle cx="10" cy="-3" r="1.2" fill="#D6B98C"/>
    
    <!-- Dainty Jhumka / Drop Earring -->
    <circle cx="0" cy="10" r="1.2" fill="#D6B98C"/>
    <path d="M0 11 L0 14 M-2 15 L2 15 M-1.5 17 L1.5 17" stroke="#D6B98C" stroke-width="1"/>
    <circle cx="0" cy="18.5" r="1" fill="#D6B98C"/>

    <!-- Saree Drape around shoulder -->
    <path d="M-15 28 C-8 24 4 28 14 36 C8 39 -4 40 -16 38 Z" fill="#D6B98C" fill-opacity="0.4" stroke="#D6B98C" stroke-width="1"/>
  </g>

  <!-- Typography: Bhaama -->
  <text x="120" y="132" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#6B2C3E" text-anchor="middle" letter-spacing="1.2">Bhaama</text>

  <!-- Star flourishes + VEEDHI -->
  <g transform="translate(120, 144)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#6B2C3E" text-anchor="middle" letter-spacing="4">✦ VEEDHI ✦</text>
  </g>

  <!-- Subtitle: Styled for Every Bhaama -->
  <text x="120" y="157" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="9" fill="#8B6C61" text-anchor="middle" letter-spacing="0.5">Styled for Every Bhaama</text>
</svg>

